<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <h1 id="glavni">marko bio ovdi</h1>

    <div id="timer">MArko</div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $("document", function () {
            $("#glavni").css({ "color": "red", "font-size": "50px" }).fadeOut()
            $("#glavni").click(function () {
                alert("duplinjoi")
            })
        })
        let vrijeme = 1;

        setInterval(function () {
            vrijeme++;
            $("#timer").text(vrijeme);
        }, 2000);

    </script>
</body>

</html>
