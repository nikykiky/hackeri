<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Registry Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.9rem;
        }

        .password-rules {
            font-size: 0.8rem;
            margin: 6px 0 10px;
            padding-left: 18px;
        }

        .password-rules li {
            margin-bottom: 3px;
        }

        .tos {
            font-size: 0.85rem;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 4px;
            background: #0078d4;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Register</h2>
        <form>
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" required />
                <label style="font-size: 0.85rem; display: flex; gap: 6px; margin: 8px 0;">
                    <input type="checkbox" id="showPass">
                    Show Password
                </label>
                <ul class="password-rules">
                    <li>Include an UPPER and lower case letter</li>
                    <li>Include a number</li>
                    <li>Include ?</li>
                    <li>Minimum 8</li>
                </ul>
            </div>

            <div class="tos">
                <label>
                    <input type="checkbox" name="tos" required />
                    I agree to the Terms of Service
                </label>
                <p></p>
            </div>

            <button type="submit">Create Account</button>
        </form>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            $('#showPass').change(function () {
                if ($('#password').attr('type') === 'password') {
                    $('#password').attr('type', 'text');
                }
                else {
                    $('#password').attr('type', 'password');
                }

            })

            $('[name=tos]').change(function () {
                if ($('.tos > p').text() === '') {
                    $('.tos > p').text("Thanks");
                }
                else {
                    $('.tos > p').text("");
                }

            })

            let alph = 'abcdefghijklmnopqrstuvwxyz'
            let Alph = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
            let Numb = '1234567890'
            $('#password').keyup(function () {
                $('.password-rules > li').css('color', 'black')
                let str = $('#password').val();
                let alphBool = false;
                let AlphBool = false;
                console.log(str);
                for (let i = 0; i < str.length; i++) {
                    for (let a = 0; a < alph.length; a++) {
                        if (str[i] === alph[a]) {
                            alphBool = true;
                        }
                    }
                    for (let A = 0; A < Alph.length; A++) {
                        if (str[i] === Alph[A]) {
                            AlphBool = true;
                        }
                    }
                    if (alphBool == true && AlphBool == true) {
                        $('.password-rules > li:nth-of-type(1)').css('color', 'green')
                    }

                    for (let n = 0; n < Numb.length; n++) {
                        if (str[i] === Numb[n]) {
                            $('.password-rules > li:nth-of-type(2)').css('color', 'green')
                        }
                    }

                    if (str[i] === '?') {
                        $('.password-rules > li:nth-of-type(3)').css('color', 'green')
                    }

                    if (str.length == 8) {
                        $('.password-rules > li:nth-of-type(4)').css('color', 'green')
                    }
                }
            })

        })
    </script>
</body>

</html>
